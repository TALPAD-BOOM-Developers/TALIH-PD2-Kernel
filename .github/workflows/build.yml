name: Build and Release Kernel

on:
  push:
    branches: [ main, master, sukisu ]
    tags: [ '*' ]
  workflow_dispatch:
    inputs:
      ref:
        description: '编译哪个分支/标签（留空 = 触发本次运行的 ref）'
        required: false
        default: ''
      lkm:
        description: '内核编译完成后，同分支继续编译 LKM'
        type: choice
        options: [ 'yes', 'no' ]
        default: 'yes'

env:
  # push/tag 触发时 inputs.lkm 为空 -> 默认开；仅手选 no 才关
  LKM_ENABLED: ${{ inputs.lkm == 'no' && '0' || '1' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 目标分支
        uses: actions/checkout@v4
        with:
          # 手动触发可指定任意分支/标签；push/tag 触发则用自身 ref
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: 打印构建目标
        run: |
          echo "分支/标签 : $(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD)"
          echo "触发方式  : ${{ github.event_name }} / ${{ github.ref }}"
          echo "LKM 开关  : ${{ env.LKM_ENABLED }}"
          echo "内核补丁  : $(ls patch/*.patch 2>/dev/null | tr '\n' ' ')"
          echo "LKM 补丁  : $(ls -d patch/lkm/* 2>/dev/null | tr '\n' ' ')"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev linux-libc-dev device-tree-compiler cpio gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf git wget xz-utils python3 python3-pip patch

      # 后端（KSU）集成：优先用分支自带的 .github/ci/su-setup.sh，
      # 否则 defconfig 启用 CONFIG_KSU 时拉取 ReSukiSU 默认流程，未启用则纯内核构建。
      # 换实现只需在新分支放自己的 .github/ci/su-setup.sh，本 workflow 不用改。
      - name: Integrate SU backend
        run: |
          if [ -x .github/ci/su-setup.sh ]; then
            echo "使用分支自带集成脚本 .github/ci/su-setup.sh"
            .github/ci/su-setup.sh
          elif grep -qE '^CONFIG_KSU=y' arch/arm64/configs/*defconfig; then
            echo "::error::defconfig 启用 CONFIG_KSU 但缺少 .github/ci/su-setup.sh"
            exit 1
          else
            echo "defconfig 未启用 CONFIG_KSU —— 跳过后端集成（纯内核构建）"
          fi

      # 内核侧补丁：仓库自带 patch/*.patch 按文件名序号全量应用，
      # 新分支要加/换补丁只需丢文件进 patch/，无需改 workflow。
      - name: Apply kernel patches
        run: |
          shopt -s nullglob
          patches=(patch/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "patch/ 下无内核补丁，跳过"
            exit 0
          fi
          for p in $(printf '%s\n' "${patches[@]}" | sort -V); do
            echo "::group::apply $p"
            patch -p1 --forward --batch --no-backup-if-mismatch < "$p"
            echo "::endgroup::"
          done
          echo "已应用：$(printf '%s ' "${patches[@]}")"

      - name: Build kernel
        run: |
          chmod +x build-mt8797.sh download_clang.sh
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          ./download_clang.sh
          ./build-mt8797.sh

      - name: Verify kernel
        run: |
          [ -f out/arch/arm64/boot/Image.gz ] || { echo "::error::out/arch/arm64/boot/Image.gz 缺失"; exit 1; }
          [ -f out/System.map ] || { echo "::error::out/System.map 缺失"; exit 1; }
          if grep -qE '^CONFIG_KSU=y' arch/arm64/configs/*defconfig; then
            grep -q '^CONFIG_KSU=y' out/.config || { echo "::error::CONFIG_KSU 未在最终 .config 中保留（kconfig 丢弃）"; exit 1; }
            grep -qE ' ksu_' out/System.map || echo "::warning::System.map 中未见 ksu_ 符号，后端可能未生效"
          fi
          echo "内核产物 OK: $(stat -c%s out/arch/arm64/boot/Image.gz) bytes"

      # ---------- LKM：同一分支、同一 job，复用上一步的 out/Module.symvers ----------
      - name: Build LKM-PathMask (pathmask.ko + procguard.ko, upstream v2.8.3)
        if: env.LKM_ENABLED == '1' && hashFiles('patch/lkm/pathmask_4.19_compat.patch') != ''
        continue-on-error: true
        run: |
          git clone --depth 1 --branch v2.8.3 https://github.com/Andrea-lyz/LKM-PathMask lkms/LKM-PathMask
          patch -p1 -d lkms/LKM-PathMask < patch/lkm/pathmask_4.19_compat.patch
          CLANG_PATH="$PWD/prebuilts/clang/host/linux-x86/clang-r383902"
          CLANG_BIN="$CLANG_PATH/bin"
          make -k O=out ARCH=arm64 \
            CC=$CLANG_BIN/clang LD=$CLANG_BIN/ld.lld AR=$CLANG_BIN/llvm-ar NM=$CLANG_BIN/llvm-nm \
            OBJCOPY=$CLANG_BIN/llvm-objcopy OBJDUMP=$CLANG_BIN/llvm-objdump READELF=$CLANG_BIN/llvm-readelf \
            OBJSIZE=$CLANG_BIN/llvm-size STRIP=$CLANG_BIN/llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
            M=$PWD/lkms/LKM-PathMask/kernel modules

      - name: Build hma-uidfake (hma_uidfake.ko)
        if: env.LKM_ENABLED == '1' && hashFiles('patch/lkm/hma_uidfake_4.19_compat.patch') != ''
        continue-on-error: true
        run: |
          git clone --depth 1 --branch main https://github.com/Kevin233B/TALIH-PD2-Kernel-4.19-hma-uidfake lkms/hma-uidfake
          patch -p1 -d lkms/hma-uidfake < patch/lkm/hma_uidfake_4.19_compat.patch
          CLANG_PATH="$PWD/prebuilts/clang/host/linux-x86/clang-r383902"
          CLANG_BIN="$CLANG_PATH/bin"
          make -k O=out ARCH=arm64 \
            CC=$CLANG_BIN/clang LD=$CLANG_BIN/ld.lld AR=$CLANG_BIN/llvm-ar NM=$CLANG_BIN/llvm-nm \
            OBJCOPY=$CLANG_BIN/llvm-objcopy OBJDUMP=$CLANG_BIN/llvm-objdump READELF=$CLANG_BIN/llvm-readelf \
            OBJSIZE=$CLANG_BIN/llvm-size STRIP=$CLANG_BIN/llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
            M=$PWD/lkms/hma-uidfake/src modules

      - name: Build Kasumi (kasumi_lkm.ko)
        if: env.LKM_ENABLED == '1' && hashFiles('patch/lkm/kasumi_4.19_compat.patch') != ''
        continue-on-error: true
        run: |
          # Kasumi 无 release tag，HEAD 会随时引入 5.10+ API（本仓兼容补丁只针对
          # 已审阅的 d26fa30）。固定提交，避免下一次上游 HEAD 漂移把 4.19 构建打挂。
          git init -q lkms/Kasumi
          git -C lkms/Kasumi remote add origin https://github.com/Rouyashiki/Kasumi
          git -C lkms/Kasumi fetch -q --depth 1 origin d26fa3044c8fd61c11446499f63f92cbcd53bfc5
          git -C lkms/Kasumi checkout -q --detach FETCH_HEAD
          patch -p1 -d lkms/Kasumi < patch/lkm/kasumi_4.19_compat.patch
          CLANG_PATH="$PWD/prebuilts/clang/host/linux-x86/clang-r383902"
          CLANG_BIN="$CLANG_PATH/bin"
          make -k O=out ARCH=arm64 \
            CC=$CLANG_BIN/clang LD=$CLANG_BIN/ld.lld AR=$CLANG_BIN/llvm-ar NM=$CLANG_BIN/llvm-nm \
            OBJCOPY=$CLANG_BIN/llvm-objcopy OBJDUMP=$CLANG_BIN/llvm-objdump READELF=$CLANG_BIN/llvm-readelf \
            OBJSIZE=$CLANG_BIN/llvm-size STRIP=$CLANG_BIN/llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
            M=$PWD/lkms/Kasumi/src modules

      - name: Collect and report LKMs
        if: env.LKM_ENABLED == '1'
        run: |
          mkdir -p modules-out
          found=0
          while IFS= read -r ko; do
            cp "$ko" modules-out/
            found=$((found+1))
          done < <(find lkms -name '*.ko' -type f)
          if [ "$found" -eq 0 ]; then
            echo "::error::没有任何 LKM 编译成功（.ko 数量为 0）"
            exit 1
          fi
          ls -la modules-out/
          echo "共编出 $found 个 .ko"

      - name: Loadability gate (config + mechanism imports + symvers resolution)
        if: env.LKM_ENABLED == '1'
        run: |
          fail=0
          # 1) 内核侧硬前提：KPROBES + FUNCTION_TRACER（缺失 = 4.19 头文件 inline 桩路线，insmod 必失败）
          for cfg in CONFIG_KPROBES CONFIG_FUNCTION_TRACER; do
            if ! grep -q "^${cfg}=y$" out/.config; then
              echo "::error::out/.config 缺少 ${cfg}=y —— kprobe/ftrace 机制会被内核头文件的 inline 桩消除，模块 insmod 必失败"
              fail=1
            else
              echo "config OK: ${cfg}=y"
            fi
          done
          # 2) 每个 .ko：核心机制导入必须在（防死代码消除假绿）+ 全部强未定义导入必须能在 out/Module.symvers 解析
          check_ko() {
            ko=$1; shift
            if [ ! -f "modules-out/$ko" ]; then
              echo "::error::modules-out/$ko 缺失"
              fail=1
              return 0
            fi
            und=$(nm "modules-out/$ko" | awk '$1=="U"{print $2}' | sort -u)
            for sym in "$@"; do
              if ! printf '%s\n' "$und" | grep -qx "$sym"; then
                echo "::error::$ko 缺少核心机制导入 $sym —— 机制被编译器当死代码消除或内核 CONFIG 未开，insmod 后功能不成立"
                fail=1
              fi
            done
            miss=0
            while IFS= read -r s; do
              [ -n "$s" ] || continue
              if ! awk -v s="$s" '$2==s{f=1} END{exit !f}' out/Module.symvers; then
                echo "::error::$ko 导入 $s 无法在 out/Module.symvers 解析 —— insmod 会报 Unknown symbol"
                miss=1
                fail=1
              fi
            done <<< "$und"
            if [ "$miss" -eq 0 ]; then
              echo "$ko: 核心导入齐全，全部 $(printf '%s\n' "$und" | wc -l) 个 UND 导入解析 OK"
            fi
            v=$(readelf -p .modinfo "modules-out/$ko" 2>/dev/null | sed -n 's/.*vermagic=//p' | head -1)
            echo "  $ko vermagic: $v"
          }
          check_ko pathmask.ko register_kprobe register_kretprobe unregister_kprobe unregister_kretprobe
          check_ko procguard.ko register_kretprobe unregister_kretprobe
          check_ko hma_uidfake.ko get_task_cred find_user free_uid
          check_ko kasumi_lkm.ko register_kprobe register_kretprobe
          if [ "$fail" -ne 0 ]; then
            echo "::error::可加载性门禁失败（详见上方 ::error 行）"
            exit 1
          fi
          echo "可加载性门禁通过：内核 CONFIG 前提 + 机制导入 + 全符号解析全部 OK"


      - name: Upload LKMs
        if: env.LKM_ENABLED == '1' && hashFiles('patch/lkm/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lkm-modules
          path: modules-out/*.ko
          retention-days: 14
          if-no-files-found: error

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            out/arch/arm64/boot/Image.gz
            out/System.map
            out/vmlinux
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Image.gz
        uses: actions/download-artifact@v4
        with:
          name: kernel-image

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kernel MT8797 ${{ github.ref_name }}
          body: Kernel Image.gz for MT8797
          files: Image.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
